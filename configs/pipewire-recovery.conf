[Unit]
# Install: mkdir -p ~/.config/systemd/user/pipewire.service.d
#          ln -snf $REPO/configs/pipewire-recovery.conf ~/.config/systemd/user/pipewire.service.d/override.conf
#          systemctl --user daemon-reload
# Boot race: vban-send fails when opti.local is unresolvable (mDNS/NM not ready).
# Widen start rate limiting so Restart=on-failure survives until network is up.
StartLimitIntervalSec=90
StartLimitBurst=20

[Service]
Restart=on-failure
RestartSec=2
RestartSteps=4
RestartMaxDelaySec=15s
