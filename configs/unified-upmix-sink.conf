# Sound Blaster X3 pro-output-0 channel order (8 aux channels):
#   aux0 = FL    aux1 = FR    aux2 = FC    aux3 = LFE
#   aux4 = RL    aux5 = RR    aux6 = SL    aux7 = SR
#
# This sink carries a 5-channel 4.1 stream: [ FL FR RL RR LFE ].
# The playback position maps each logical channel to one aux port:
#   [ AUX0 AUX1 AUX4 AUX5 AUX3 ]
#   FL -> aux0, FR -> aux1, RL -> aux4, RR -> aux5, LFE -> aux3
#
# amixer shows the Speaker Playback Volume control with ALSA's generic
# channel names, which do not match the X3 order above. In particular,
# index 4 is RL (labelled "Front Center") and index 5 is RR (labelled
# "Woofer"). See docs/channel-map.md.
context.modules = [
    {
        name = libpipewire-module-loopback
        args = {
            node.description = "Unified Surround Upmix"
            audio.position = [ FL FR RL RR LFE ]
            capture.props = {
                node.name = "unified-upmix"
                media.class = Audio/Sink
                node.priority.driver = 1000
                node.priority.session = 1000
                channelmix.upmix = true
                channelmix.upmix-method = psd
                channelmix.rear-delay =  22.0
                channelmix.mix-lfe = false
            }
            playback.props = {
                node.name = "unified-upmix-output"
                audio.position = [ AUX0 AUX1 AUX4 AUX5 AUX3 ]
                target.object = "@X3_SINK@"
                node.passive = true
                stream.dont-remix = true
                node.volume = 1.0
            }
        }
    }
]
