# Edit this file per machine, then run the matching make target.
# Both machines can share these values.

# Peer that runs the X3. The sender connects here.
HOST_ADDR="opti.local"

# Sender session name shown by PipeWire.
SENDER_NAME="kubuntu-audio"

# VBAN UDP port. Must match on both ends.
VBAN_PORT="6980"

# ALSA card id for the X3.
CARD_ID="X3"

# X3 pro-audio output node. Find with:
#   pactl list short sinks | grep pro-output
X3_SINK="alsa_output.usb-Creative_Technology_Ltd_Sound_Blaster_X3_9E42D45FF9ACC811-03.pro-output-0"
